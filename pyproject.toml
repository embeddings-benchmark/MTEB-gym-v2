[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "mteb-gym"
version = "0.3.0"
description = "Label-free, LLM-judged model selection for embedding models, built on mteb"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["mteb[bm25s]>=2.0"]   # mteb brings torch, sentence-transformers, datasets, numpy, scipy

[project.optional-dependencies]
openai = ["openai>=1.40"]     # judge / generator on any /chat/completions endpoint (vLLM, OpenAI, Together)
claude = ["anthropic>=0.40"]  # judge / generator on the Anthropic API
colbert = ["mteb[pylate]>=2.0"]

[project.scripts]
mteb-gym = "mteb_gym.__main__:main"

[dependency-groups]
test = ["pytest>=8"]
dev = [{ include-group = "test" }, "ruff"]

[tool.setuptools]
packages = ["mteb_gym"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["F", "I", "E", "W", "UP"]
ignore = ["E501"]   # the formatter owns line length
