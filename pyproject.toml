[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "mteb-gym"
version = "0.3.0"
description = "Label-free, LLM-judged model selection for embedding models, built on mteb"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy"]

[project.optional-dependencies]
# running models: mteb loads them; bm25s/PyStemmer for the BM25 baseline
retrieval = ["mteb>=2.0", "sentence-transformers>=2.7", "torch", "bm25s", "PyStemmer"]
colbert = ["pylate"]
# judge / generator backends
claude = ["anthropic>=0.40"]
openai = ["openai>=1.40"]   # also vLLM, Together and any /chat/completions server
full = ["mteb>=2.0", "sentence-transformers>=2.7", "torch", "bm25s", "PyStemmer", "pylate",
        "anthropic>=0.40", "openai>=1.40"]

[project.scripts]
mteb-gym = "mteb_gym.__main__:main"

[dependency-groups]
test = ["pytest>=8"]
dev = [{ include-group = "test" }, "ruff"]

[tool.setuptools]
packages = ["mteb_gym"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["F", "I", "E", "W", "UP"]
ignore = ["E501"]   # the formatter owns line length
